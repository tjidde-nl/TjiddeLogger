trigger:
  branches:
    include:
      - main
      - release/*
  tags:
    include:
      - 'v*'

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: 'Release'
  projectPath: 'src/Tjidde.Logging/Tjidde.Logging.csproj'
  # Set these in Azure DevOps pipeline variables (mark as secret where appropriate):
  #   NEXUS_URL       - e.g. https://nexus.example.com/repository/nuget-hosted/
  #   NEXUS_USERNAME  - Nexus username
  #   NEXUS_PASSWORD  - Nexus password (mark as secret)

stages:
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, Test & Pack'
        pool:
          vmImage: 'ubuntu-latest'

        strategy:
          matrix:
            net7:
              targetFramework: 'net7.0'
            net8:
              targetFramework: 'net8.0'
            net9:
              targetFramework: 'net9.0'
            net10:
              targetFramework: 'net10.0'

        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '10.x'
              includePreviewVersions: true

          - task: DotNetCoreCLI@2
            displayName: 'Restore ($(targetFramework))'
            inputs:
              command: 'restore'
              projects: '$(projectPath)'
              arguments: '-p:TargetFramework=$(targetFramework)'

          - task: DotNetCoreCLI@2
            displayName: 'Build ($(targetFramework))'
            inputs:
              command: 'build'
              projects: '$(projectPath)'
              arguments: '--configuration $(buildConfiguration) --framework $(targetFramework) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Test ($(targetFramework))'
            inputs:
              command: 'test'
              projects: 'tests/**/*.Tests.csproj'
              arguments: '--configuration $(buildConfiguration) --framework $(targetFramework) --no-build'
              publishTestResults: true
            continueOnError: false

          - task: PublishTestResults@2
            displayName: 'Publish Test Results ($(targetFramework))'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'
              mergeTestResults: true
              testRunTitle: 'Tests - $(targetFramework)'

  - stage: Pack
    displayName: 'Pack NuGet'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Pack
        displayName: 'Create NuGet Package'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET 10'
            inputs:
              packageType: 'sdk'
              version: '10.x'
              includePreviewVersions: true

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: '$(projectPath)'

          - task: DotNetCoreCLI@2
            displayName: 'Pack NuGet (multi-target)'
            inputs:
              command: 'pack'
              packagesToPack: '$(projectPath)'
              configuration: '$(buildConfiguration)'
              nobuild: false
              includesymbols: true
              includesource: false
              versioningScheme: 'off'
              outputDir: '$(Build.ArtifactStagingDirectory)/nuget'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish NuGet Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/nuget'
              ArtifactName: 'nuget-packages'
              publishLocation: 'Container'

  - stage: Push
    displayName: 'Push to Nexus'
    dependsOn: Pack
    condition: and(succeeded(), or(startsWith(variables['Build.SourceBranch'], 'refs/tags/v'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
    jobs:
      - deployment: PushToNexus
        displayName: 'Push NuGet to Nexus'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'nexus-nuget'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: UseDotNet@2
                  displayName: 'Install .NET 10'
                  inputs:
                    packageType: 'sdk'
                    version: '10.x'
                    includePreviewVersions: true

                - task: DownloadBuildArtifacts@1
                  displayName: 'Download NuGet Artifact'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'nuget-packages'
                    downloadPath: '$(Pipeline.Workspace)/nuget-packages'

                - script: |
                    dotnet nuget add source "$(NEXUS_URL)" \
                      --name NexusNuGet \
                      --username "$(NEXUS_USERNAME)" \
                      --password "$(NEXUS_PASSWORD)" \
                      --allow-insecure-connections \
                      --store-password-in-clear-text
                    dotnet nuget push "$(Pipeline.Workspace)/nuget-packages/nuget-packages/*.nupkg" \
                      --source NexusNuGet \
                      --skip-duplicate
                  displayName: 'Push to Nexus'
