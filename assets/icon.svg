<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Tjidde.Logging</title>
  <!-- Solid accent tile keeps the mark readable on both light and dark backgrounds -->
  <rect x="0" y="0" width="128" height="128" rx="24" ry="24" fill="#0F766E"/>
  <!-- Stylized "T" -->
  <rect x="22" y="24" width="60" height="14" rx="4" fill="#FFFFFF"/>
  <rect x="45" y="24" width="14" height="80" rx="4" fill="#FFFFFF"/>
  <!-- Log lines -->
  <rect x="68" y="54" width="38" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="68" y="74" width="28" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.7"/>
  <rect x="68" y="94" width="18" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.5"/>
</svg>
